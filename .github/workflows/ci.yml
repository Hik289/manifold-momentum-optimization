name: Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  numerical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Numerical invariants
        run: python experiments/tests/test_numerical.py --out /tmp/bures-numerical.json
      - name: Quickstart
        run: python examples/quickstart.py
