[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buresmomentum"
version = "0.1.0"
description = "Bures--Wasserstein covariance averaging for matrix preconditioning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24"]

[project.optional-dependencies]
experiments = ["scipy>=1.10", "scikit-learn>=1.3", "pandas>=2.0", "matplotlib>=3.7", "torchvision>=0.16", "requests>=2.31", "pyarrow>=14"]
graph = ["torch-geometric>=2.4"]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "experiments"}

[tool.setuptools.packages.find]
where = ["experiments"]
include = ["bures*"]
